[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-memory-ranker"
version = "0.1.0"
description = "Reproducible evidence retrieval for persona memory, with R-trained rankers"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
encoder = ["sentence-transformers>=3,<6"]

[project.scripts]
pmr = "persona_memory_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
