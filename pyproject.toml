[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-memory-selector"
version = "0.1.0"
description = "Classify and retrieve behavioral examples for consistent AI role-playing"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
encoder = ["sentence-transformers>=3,<6"]

[project.scripts]
pms = "persona_memory_selector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
