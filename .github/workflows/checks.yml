name: Checks and demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m unittest discover -s web -p 'test_*.py'
      - run: node web/tests.js

  r-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install Linux dependency for R fs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libuv1-dev
      - run: Rscript R/bootstrap.R
      - run: Rscript R/selector/bootstrap.R
      - run: Rscript tests/test_r_pipeline.R
      - run: Rscript tests/test_selector_r.R
      - run: Rscript tests/test_selector_resume.R

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python-web, r-pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
